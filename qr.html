<style>
/* One poster: logo, name, the code to scan, the address as text. Single warm light look on purpose. */
:root{--ink:#22203A;--muted:#5E5A72;--bg1:#FFF4EA;--bg2:#FDEAF2;--card:#FFFFFF;--line:#EFE4D8;color-scheme:light}
html,body{height:100%}
body{margin:0;background:radial-gradient(800px 600px at 85% 10%,#FFE3D6,transparent 60%),radial-gradient(800px 600px at 10% 95%,#DCEEFF,transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:"Varela Round",system-ui,sans-serif;
  display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.card{background:var(--card);border-radius:36px;box-shadow:0 2px 0 var(--line),0 30px 70px rgba(34,32,58,.14);padding:28px 28px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;width:min(100%,460px);box-sizing:border-box;text-align:center}
.logo{width:140px;height:108px}
h1{margin:0;font-family:Fredoka,"Varela Round",sans-serif;font-weight:600;font-size:clamp(30px,7vw,42px);line-height:1.05;text-wrap:balance}
p{margin:0;font-size:17px;line-height:1.5;color:var(--muted);max-width:34ch}
#qr{width:min(100%,320px);aspect-ratio:1;border-radius:24px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center}
#qr svg{width:88%;height:88%}
.url{font-family:Fredoka,sans-serif;font-weight:500;font-size:15px;direction:ltr;user-select:all;background:#FFF1E6;border-radius:999px;padding:8px 14px;word-break:break-all}
.steps{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:14px;color:var(--muted)}
.steps span{background:#F6EEE6;border-radius:999px;padding:6px 12px}

<h1>כמו שתי טיפות מים</h1>
<p>סרקו עם מצלמת הטלפון ונסו בעצמכם. זו גרסת הדגמה עם נתוני דוגמה, אין צורך להתחבר.</p>
<div id="qr" role="img" aria-label="קוד לסריקה שפותח את גרסת ההדגמה"></div>
<div class="url" id="u">https://itamarna1924.github.io/twins-tracker/demo.html</div>
<div class="steps"><span>לחצו על הטיפות</span><span>רשמו האכלה או חיתול</span><span>נסו "לשניהם"</span></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(()=>{ const url=document.getElementById('u').textContent.trim(); const box=document.getElementById('qr');
  try{ const q=qrcode(0,'H'); q.addData(url); q.make(); const n=q.getModuleCount(); let r='';
    for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(q.isDark(y,x)) r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`;
    box.innerHTML=`<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><g fill="#22203A">${r}</g></svg>`; }
  catch(e){ box.textContent='הקוד לא נטען. אפשר להקליד את הכתובת שמתחת.'; } })();
</script>
