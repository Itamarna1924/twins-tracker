<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>כמו שתי טיפות מים</title>
<meta name="theme-color" content="#FFF1E6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Varela+Round&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="drops.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="drops.js"></script>
</head>
<body>
<div class="wrap gate" id="gate" dir="rtl">
  <img class="logo" src="icons/icon-192.png" alt="">
  <h1>כמו שתי טיפות מים</h1>
  <p id="gateMsg">טוען…</p>
  <button class="gbtn" id="signinBtn" hidden>כניסה עם Google</button>
  <button class="sbtn" id="signoutBtn" hidden>יציאה מהחשבון</button>
  <button class="gbtn" id="installBtn" hidden style="background:var(--a);color:var(--a-ink)">התקנה כאפליקציה בטלפון</button>
</div>
<div id="appRoot" hidden>


<div class="wrap" dir="rtl" lang="he">
  <header>
    <svg class="logo2" viewBox="0 0 40 34" aria-hidden="true"><path d="M27 3C27 3 17 15 17 21.5a10 10 0 0 0 20 0C37 15 27 3 27 3Z" fill="#2F8BEA"/><path d="M12 7C12 7 3 18 3 23.5a9 9 0 0 0 18 0C21 18 12 7 12 7Z" fill="#F2604E"/><circle cx="9" cy="22" r="1.6" fill="#22203A"/><circle cx="15" cy="22" r="1.6" fill="#22203A"/><circle cx="24" cy="20" r="1.7" fill="#22203A"/><circle cx="30.5" cy="20" r="1.7" fill="#22203A"/></svg><h1>כמו שתי טיפות מים</h1>
    <span class="sync" id="sync"><i></i><span id="syncTxt">מתחבר…</span></span>
    <button class="iconbtn" id="freeBtn" aria-label="רישום בכתיבה" title="רישום בכתיבה"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button>
    <button class="iconbtn" id="nightBtn" aria-label="מצב לילה" title="מצב לילה"><svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    <button class="iconbtn" id="setBtn" aria-label="הגדרות" title="הגדרות"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
  </header>
  <div class="ro-note" id="roNote" hidden>מצב צפייה בלבד. אפשר לראות את כל הרישומים, אבל לא להוסיף או לשנות.</div>
  <main id="view"></main>
  <form class="free w" id="freeForm" autocomplete="off" hidden>
    <input id="freeIn" enterkeyhint="send" aria-label="רישום בכתיבה חופשית" placeholder="כתיבה או הכתבה: ״אלה 90 מ״ל, נועה חיתול קקי״">
    <button class="sbtn dark" type="submit">רישום</button>
  </form>
</div>

<div class="drops" id="dropsRoot" dir="rtl" lang="he" hidden></div>
<nav class="tabs" aria-label="מסכים"><div class="in" id="tabs" dir="rtl"></div></nav>
<div class="toast" id="toast" hidden><div class="in" dir="rtl"></div></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" dir="rtl" role="dialog" aria-modal="true"></div></div>


</div>
<script type="module" src="boot.js"></script>
</body>
</html>
